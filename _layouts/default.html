<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip }}">
  <meta property="og:image" content="{{ site.url }}/{{ site.data.profile.photo }}">
  <meta property="og:type" content="website">
  <link rel="canonical" href="{{ site.url }}/">
  <link rel="icon" type="image/png" href="{{ '/seal_icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.data.profile.name }}",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/{{ site.data.profile.photo }}",
    "worksFor": { "@type": "Organization", "name": "Meta" },
    "alumniOf": ["University of California, Berkeley", "IIT Kanpur"],
    "sameAs": [{% for l in site.data.profile.links %}{% unless l.url contains 'mailto' %}"{{ l.url }}"{% unless forloop.last %},{% endunless %}{% endunless %}{% endfor %}]
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#top">{{ site.data.profile.name }}</a>
      <nav aria-label="Sections">
        <a href="#work">Work</a>
        <a href="#research">Research</a>
        <a href="#career">Career</a>
      </nav>
    </div>
  </header>
  <main id="top">
    {{ content }}
  </main>
  <footer class="footer">
    <div class="wrap">
      <span>© {{ site.time | date: "%Y" }} {{ site.data.profile.name }}</span>
      <span>{% for l in site.data.profile.links %}<a href="{{ l.url }}">{{ l.label }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}</span>
    </div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
