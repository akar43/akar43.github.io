{%- comment -%} Thumbnail: a looping video when `video` is set, else the image. Pass item=… {%- endcomment -%}
{%- assign m = include.item -%}
{%- if m.video -%}
<video src="{{ m.video | relative_url }}" poster="{{ m.image | relative_url }}" autoplay loop muted playsinline preload="metadata" aria-label="{{ m.title | escape }}"></video>
{%- elsif m.image -%}
<img src="{{ m.image | relative_url }}" alt="{{ m.title | escape }}" loading="lazy" decoding="async">
{%- endif -%}
