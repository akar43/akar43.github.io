# Short paragraphs, newest first.
bio: |
  I work at **Meta** on the future of social connection with the
  [Codec Avatars](https://junxuan-li.github.io/lca/) team — photorealistic
  telepresence, from large-scale avatar models to hologram calling on Meta's
  glasses.

  Before Meta I spent 4.5 years at **Google AR**, leading applied research that
  shipped: I was the architect for mixed reality passthrough and spatialization on
  Samsung Galaxy XR, founded the photo and video spatialization work in Google
  Photos, and shipped the ARCore Depth API, Cinematic photos and Pixel portrait mode.

  Earlier, I was Director of Machine Learning at **Fyusion**, a spatial photography
  startup, and did my PhD at **UC Berkeley** with Jitendra Malik on learned 3D
  reconstruction.

