# Short paragraphs, newest first.
bio: |
  I'm an AI Research Scientist at **Meta Reality Labs**, building the future of
  social connection through photorealistic telepresence with the
  [Codec Avatars](https://www.meta.com/emerging-tech/codec-avatars) team, from large-scale avatar
  models to [hologram calling](https://www.engadget.com/2267223/meta-holograph-avatar-for-ai-and-vr-glasses-update-hands-on/)
  on Meta's glasses.

  My work spans smartphone photography and mixed reality. At **Google** I took
  research into products used at scale: ML depth for photography and AR on 1B+
  Android devices (ARCore Depth API, Cinematic photos, Pixel portrait mode); the
  mixed reality passthrough stack on Samsung Galaxy XR, as its uber-TL; and photo and
  video spatialization in Google Photos, which I founded.

  Earlier, I founded the ML team at **Fyusion**, whose damage detection drove its
  acquisition by Cox Automotive, and did my PhD at **UC Berkeley** with Jitendra Malik.

